services:
  chrome:
    image: selenium/standalone-chrome:128.0
    container_name: chrome
    shm_size: 2gb
    ports:
      - "4444:4444"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4444/wd/hub/status || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  tests:
    build: .
    container_name: tests
    depends_on:
      chrome:
        condition: service_healthy
    environment:
      - SELENOID_URL=http://chrome:4444/wd/hub
    volumes:
      - ./allure-results:/app/allure-results
    command: ["pytest", "-v", "--alluredir=allure-results"]